<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Rewind</title><style>
@font-face{font-family:"Lilita One";src:url(../fonts/LilitaOne-Regular.ttf) format("truetype")}
html,body{margin:0;padding:0;border:0;width:100%;height:100%;overflow:hidden;background:#000}
#rw-stage{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;background:#000;max-width:none;max-height:none}
#rw-stage video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;border:0;margin:0}
#rw-stage iframe{position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;background:#000}
.rw-banner{position:fixed;left:16px;bottom:16px;z-index:2;padding:6px 14px;border-radius:14px;font:20px "Lilita One","Varela Round",sans-serif;color:#eaf4ff;
 background:linear-gradient(180deg,rgba(40,92,146,.92),rgba(17,44,76,.94));border:3px solid #6fb7e8;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 #071426;text-shadow:0 2px 0 #0b1a2e;pointer-events:none}
#rw-fs{position:fixed;top:12px;right:12px;z-index:3;padding:6px 12px;border-radius:12px;font:16px "Lilita One",sans-serif;color:#3a1d00;cursor:pointer;
 background:linear-gradient(#ffe27a,#f6b21b 55%,#e07e10);border:2px solid #fff3b8;box-shadow:0 3px 0 #7a3c00;opacity:0;visibility:hidden;transition:opacity .3s}
#rw-fs.show{opacity:1;visibility:visible}
#rw-shield{position:fixed;inset:0;z-index:1;background:transparent}
</style></head><body>
<div id="rw-stage"></div>
<div id="rw-shield" title="Click or double-click for fullscreen"></div>
<div class="rw-banner" id="rw-banner">Audio is LIVE · Gameplay is a REWIND</div>
<button id="rw-fs" type="button" aria-label="Fullscreen">&#x26F6; Fullscreen</button>
<script>window.REWIND_YT_ID="BBEOOdY_k5A";</script><script src="../js/rewind.js"></script>
<script>(function(){var b=document.getElementById("rw-fs"),t=null,d=document.documentElement;
function fs(){if(document.fullscreenElement){return}var r=d.requestFullscreen||d.webkitRequestFullscreen;if(r)try{var p=r.call(d);if(p&&p.catch)p.catch(function(){})}catch(e){}}
function show(){b.classList.add("show");clearTimeout(t);t=setTimeout(function(){b.classList.remove("show")},3000)}
b.addEventListener("click",function(e){e.stopPropagation();if(document.fullscreenElement)document.exitFullscreen();else fs()});
var s=document.getElementById("rw-shield");s.addEventListener("click",fs);s.addEventListener("dblclick",fs);
document.addEventListener("mousemove",show);})();</script>
</body></html>
